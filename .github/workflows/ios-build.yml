name: iOS Build (Kumo)

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-agent-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test native approval, Stop and history UI
        run: |
          python iOS/scripts/stage-native-ui.py --check
          python iOS/scripts/test-native-file-agent-ui.py --output ../.local/file-agent-ui-proof
          python -c "import shutil; shutil.copytree('../.local/file-agent-ui-proof', 'file-agent-ui-proof')"
      - name: Upload UI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kumo-file-agent-UI-proof
          path: file-agent-ui-proof
          if-no-files-found: warn

  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage native web UI
        run: |
          python3 iOS/scripts/stage-native-ui.py
          python3 iOS/scripts/test-stage-native-ui.py
          R=iOS/Sources/AppHarness-Resources
          cp app/src/main/assets/xterm.js $R/xterm.js
          cp app/src/main/assets/xterm.css $R/xterm.css
          cp app/src/main/assets/xterm-addon-fit.js $R/xterm-addon-fit.js
          cp app/src/main/assets/thread-preview.html $R/thread-preview.html
          cp app/src/main/assets/kumo_*.png $R/

      - name: Run KumoCore tests (host)
        run: |
          python3 - <<'PY'
          import pathlib
          import shutil
          import subprocess
          import tempfile

          # The app is iOS-only; isolate its actual core sources/tests in a host package
          # instead of asking SwiftPM to also compile UIKit or masking failures.
          with tempfile.TemporaryDirectory(prefix='kumo-core-tests-') as directory:
              root = pathlib.Path(directory)
              shutil.copytree('iOS/Sources/KumoCore', root / 'Sources/KumoCore')
              shutil.copytree('iOS/Tests/KumoCoreTests', root / 'Tests/KumoCoreTests')
              (root / 'Package.swift').write_text('''// swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "KumoCoreHostTests",
              platforms: [.macOS(.v13)],
              targets: [
                  .target(name: "KumoCore"),
                  .testTarget(name: "KumoCoreTests", dependencies: ["KumoCore"])
              ]
          )
          ''')
              subprocess.run(['swift', 'test', '--package-path', str(root)], check=True, timeout=180)
          PY

      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate

      - name: Build native app (unsigned)
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project Kumo.xcodeproj \
            -scheme Kumo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | xcpretty

      - name: Stage unsigned IPA without server binaries
        working-directory: iOS
        run: |
          set -e
          APP=.build/DerivedData/Build/Products/Release-iphoneos/Kumo.app
          test -d "$APP"
          test ! -f "$APP/AppHarness-Resources/opencode"
          # Keep the UI host's ordinary sandbox: private platform/no-container rights
          # blocked WebKit XPC and IOSurface on the target iPad.
          cat > "$APP/entitlements.plist" <<'ENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>get-task-allow</key><true/></dict></plist>
          ENTS
          mkdir -p .build/Payload
          cp -R "$APP" .build/Payload/Kumo.app
          python3 - <<'PY'
          import pathlib
          import zipfile
          root = pathlib.Path('.build')
          with zipfile.ZipFile('Kumo.ipa', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted((root / 'Payload').rglob('*')):
                  archive.write(path, path.relative_to(root))
          print('IPA bytes:', pathlib.Path('Kumo.ipa').stat().st_size)
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumo.ipa-unsigned
          path: iOS/Kumo.ipa
          if-no-files-found: error
